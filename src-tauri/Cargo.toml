[package]
name = "pi-mobile"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pi_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
regex = "1"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
rand = "0.10"
base64 = "0.22"
# D12 skills 安装器：reqwest 已在依赖树内（tauri-plugin-http），显式声明以直接用
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-geolocation = "2.3.3"
# pi-mobile 自建设备能力（Android 定位；1b 将承载日历/通讯录/照片）。
# 路径依赖而非 crates.io：它是本仓的一部分，且 build.rs 需要能找到同目录的
# ios/ 与 android/ 原生源码才能把它们编进产物。
tauri-plugin-pi-native = { path = "plugins/pi-native" }
# D15 预览：用 axum + tower-http::ServeDir 替掉手写 HTTP 解析。
# 成本很低：hyper/tower/tower-http 已由 tauri 传递引入（见 Cargo.lock），
# 这里只新增 axum 本身；tokio 只多要 `net`/`fs` feature。
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio = { version = "1", features = ["net", "fs"] }
# D16 Git 集成。用 git2（libgit2 绑定）而非 gix —— 实测 gix 0.87.1 **没有 push**
# （remote/connection 下只有 fetch/，无 prepare_push），而 push 是本需求明确要的。
# 交叉编译风险有生产级先例可循：GitSync（Flutter+Rust，Android 5+/iOS 13+）用
# git2 + vendored-libgit2 + vendored-openssl，配方就是 .cargo/config.toml 里那两个 env。
# 先按「和它一样」验证，不要一上手就裁掉 openssl。
# ⚠️ `https` **必须显式列出**：git2 的 default = ["ssh", "https"]，而我们用
# default-features = false 会把它一起关掉 —— 只留 vendored-openssl 只保证
# **openssl 被编出来**，并**不**启用 libgit2 的 HTTPS transport。真机症状：
#     clone failed: there is no TLS stream available; class=Ssl (16)
# 不列 ssh：v1 只认 https（validate_remote 拒 ssh://），列了会多引入
# libssh2-sys 这个 C 库。
git2 = { version = "0.20", default-features = false, features = [
    "https",
    "vendored-libgit2",
    "vendored-openssl",
] }
# agent 工具实现（workspace 越狱 + 写前备份/回滚）。抽成本仓独立 crate 是为了让
# Tauri 之外的宿主也能复用同一份实现 —— 见 `spikes/quickjs-agent`（QuickJS 宿主）
# 与 `docs/POCKET-PI-NOTES.md`。loopback.rs 只保留同名转发，行为不变。
pi-host-tools = { path = "../crates/pi-host-tools" }

# D4 凭证：keyring 无 Android Keystore 后端（v3 支持 mac/win/linux/ios），
# Android 侧 cfg 隔离为沙箱文件态（见 src/creds.rs），不编译本依赖。
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# M4 保活：keepalive.rs 经 JNI 驱动 Kotlin ForegroundService（已在 tauri 依赖树内）
[target.'cfg(target_os = "android")'.dependencies]

[dev-dependencies]
filetime = "0.2"
# preview 的路由测试用 oneshot（不起 socket）：那才是真的跑过 ServeDir +
# 中间件那一栈，而不是只测几个辅助函数。tower 本就在依赖树里（tauri 传递引入）。
tower = { version = "0.5", features = ["util"] }

