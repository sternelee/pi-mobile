name: pi-mobile
options:
  bundleIdPrefix: com.sternelee.pi-mobile
  deploymentTarget:
    # 16.0: libskal.dylib（JSC 从源码构建）的 LC_BUILD_VERSION minos。
    # 低于此版本链接器告警，且嵌入式运行时依赖 iOS 16 的 JSC/WTF 行为。
    iOS: 16.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
# 真机签名：自动签名 team（主要配置在 target settings.base；CI/换团队时改那里）
settingGroups:
  app:
    base:
      PRODUCT_NAME: pi-mobile
      PRODUCT_BUNDLE_IDENTIFIER: com.sternelee.pi-mobile
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  pi-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Externals 只作为搜索路径（LIBRARY_SEARCH_PATHS）；libskal.dylib 必须
      # 走 Frameworks 依赖的 Embed 阶段，不能被当普通资源拷贝。
      - path: Externals
        excludes:
          - "**/*.dylib"
      - path: pi-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: pi-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # ── M6 系统能力的用途描述 ─────────────────────────────────
        # iOS 强制要求：访问对应 API 前若缺 key，不是返回错误而是**直接崩溃**。
        # 文案原则：说清「agent 拿它做什么」，不是「我们需要此权限」——
        # 审核会读这段，用户也在系统弹窗里看到它。
        #
        # 已在用（第一批）：定位。
        NSLocationWhenInUseUsageDescription: pi 需要你的位置，以便查询本地天气、通勤时间和附近信息。
        # 第一批 1b（日历/通讯录/照片）将用；先声明避免插件落地时漏 key 而崩。
        # TODO(1b)：iOS 17+ 读写日历改由 NSCalendarsFullAccessUsageDescription /
        #   NSCalendarsWriteOnlyAccessUsageDescription 控制，需实测确认是否两个都要。
        NSCalendarsUsageDescription: pi 需要读取日历，以便回答「今天有什么安排」并帮你创建事件。
        NSContactsUsageDescription: pi 需要读取通讯录，以便在你要求「给某某发消息」时找到对应联系人。
        NSPhotoLibraryUsageDescription: pi 需要访问照片，以便按你的要求查找、整理或复制图片到工作区。
        # 批次 2（提醒事项/蓝牙）落地时再加：NSRemindersUsageDescription、
        #   NSBluetoothAlwaysUsageDescription —— 未实现的权限不提前声明。
    entitlements:
      path: pi-mobile_iOS/pi-mobile_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        DEVELOPMENT_TEAM: UJ8NW4N779
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64 $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - framework: Externals/arm64/libskal.dylib
        embed: true
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      # 注意：不用 ${FORCE_COLOR} —— 环境里 FORCE_COLOR=0 会被展开成位置参数，
      # tauri-cli 把它当 arch 解析直接报错（"Arch specified by Xcode was invalid"）
      - script: bun tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a