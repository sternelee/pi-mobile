[package]
name = "tauri-plugin-pi-native"
version = "0.1.0"
description = "pi-mobile 自建设备能力：Android 定位、双端日历/通讯录/照片"
authors = ["pi-mobile"]
edition = "2021"
license = "MIT OR Apache-2.0"
# links + build.rs：让 tauri-plugin 的构建脚本把 ios/ 的 Swift 链成静态库、
# 把 android/ 交给 gradle（见 build.rs 与 docs/PROGRESS.md 的侦察结论）。
links = "tauri-plugin-pi-native"
build = "build.rs"

[lib]
name = "tauri_plugin_pi_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
