name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # pi-bundle/dist/ 是 gitignore 的，而 guest.rs 用 include_str! 编它 ——
      # 任何 cargo 步骤之前都必须先出 bundle，否则新 clone 直接编译失败。
      - name: build agent bundle
        run: bun run bundle:build
      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: cargo test
        run: cargo test
        working-directory: src-tauri
      - name: qjs integration (offline)
        # 这三个测试都带 #[ignore]（agent_init 是 OnceLock：一个进程只能 boot 一次），
        # 而 qjs 出过的两个 bug 恰好只能被它们发现 —— 所以必须显式跑（见脚本头注释）。
        run: bash scripts/qjs-tests.sh

  android-cross-check:
    # M0 骨架：只做 aarch64-android 交叉编译检查（真机/模拟器 E2E 后续加）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # pi-bundle/dist/ 是 gitignore 的，而 guest.rs 用 include_str! 编它 ——
      # 任何 cargo 步骤之前都必须先出 bundle，否则新 clone 直接编译失败。
      - name: build agent bundle
        run: bun run bundle:build
      - name: install NDK toolchain
        run: |
          ANDROID_HOME=$HOME/android-sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null || true
      - name: cargo check (aarch64-linux-android)
        run: cargo check --target aarch64-linux-android
        working-directory: src-tauri
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

  desktop-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: install Linux webkit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      # beforeBuildCommand 里已经有 bundle:build；这里显式再跑一次是给
      # 「构建失败时能一眼看出是 bundle 还是 tauri」用的（脚本幂等，0.1s）。
      - run: bun run bundle:build
      - run: bun tauri build --no-bundle
